name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zips
        run: npm run zip
      - name: Upload zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Collage Studio $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.zip --clobber
